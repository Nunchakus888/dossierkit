name: View counter v2 checks
on:
  push:
    branches: [implementation/views-v2-20260921]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ACTIVE_PROFILE: default
      DEFAULT_LOCALE: zh
      PUBLIC_SITE_URL: https://sunionpeaks.pages.dev
      PUBLIC_VIEWS_ENABLED: 'true'
      GITHUB_REPOSITORY: Nunchakus888/dossierkit
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Integrate candidate without changing production
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = 0428df54c13aa613148f11cc9b8aa06b538c4cd1
          echo "VIEWS_BASE=$(git rev-parse origin/main)" >> "$GITHUB_ENV"
          python3 scripts/views/apply-v2.py
          git restore --source=origin/main --staged --worktree .github
          git rm scripts/views/apply-v2.py
          git add src scripts docs migrations
          echo "VIEWS_TREE=$(git write-tree)" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run counter, content and integration regressions
        run: |
          pnpm dossier generate-admin-config
          pnpm test:views
          pnpm test:notes
          pnpm test:assets
          pnpm test:integrations
          pnpm validate
      - name: Verify actual local D1 binding
        run: node scripts/views/runtime-test.mjs
      - name: Build enabled site
        run: |
          pnpm build
          pnpm exec tsx scripts/export-publication.ts
          node scripts/test-publication-build.mjs
          node scripts/verify-note-covers.mjs
      - name: Verify article and CV on mobile and desktop
        run: |
          pnpm exec playwright install --with-deps chromium
          node scripts/views/browser-test.mjs
      - name: Publish tested code-only candidate branch
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          CANDIDATE=$(printf '%s\n' 'feat: idempotent PV, browser UV, sources and standalone page counters' | git commit-tree "$VIEWS_TREE" -p "$VIEWS_BASE")
          test -z "$(git diff --name-only "$VIEWS_BASE" "$CANDIDATE" -- .github)"
          git push origin "$CANDIDATE:refs/heads/candidate/views-v2-20260921"
          printf '{"commit":"%s","tree":"%s","base":"%s","tests":"passed","productionWrites":0}\n' "$CANDIDATE" "$VIEWS_TREE" "$VIEWS_BASE" > artifacts/views/candidate.json
          git archive --format=zip "$CANDIDATE" > artifacts/views/candidate-source.zip
      - name: Save private verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: views-v2-verification
          path: artifacts/views/
          retention-days: 7
