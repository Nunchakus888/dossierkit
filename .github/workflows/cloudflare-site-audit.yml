name: Cloudflare site audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/cloudflare-site-audit.yml
      - scripts/cloudflare-site-audit.py

permissions:
  contents: read

concurrency:
  group: cloudflare-site-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Read Pages inventory, attribution, sampling and public HTTP behavior
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 scripts/cloudflare-site-audit.py
      - name: Store sanitized audit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cloudflare-site-audit
          path: audit/cloudflare-site-audit.json
          retention-days: 7
          if-no-files-found: error
