name: CI

on:
  pull_request:
    paths-ignore:
      - AGENTS.md
      - README.md
      - docs/**
  push:
    branches:
      - main
    paths-ignore:
      - AGENTS.md
      - README.md
      - docs/**
  workflow_dispatch:
    inputs:
      active_profile:
        description: Active profile pack
        required: true
        default: default
      site_url:
        description: Public site URL
        required: true
        default: https://sunionpeaks.pages.dev

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ACTIVE_PROFILE: ${{ inputs.active_profile || 'default' }}
      DEFAULT_LOCALE: zh
      PUBLIC_SITE_URL: ${{ inputs.site_url || 'https://sunionpeaks.pages.dev' }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate CMS config
        run: pnpm dossier generate-admin-config

      - name: Validate active profile
        run: pnpm validate

      - name: Build static site
        run: pnpm build

      - name: Deploy to Cloudflare Pages
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler pages deploy dist --project-name=${{ vars.CLOUDFLARE_PROJECT_NAME }} --branch=${{ github.ref_name }}
