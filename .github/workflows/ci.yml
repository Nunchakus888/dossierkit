name: CI

on:
  pull_request:
    paths-ignore:
      - AGENTS.md
      - README.md
      - docs/**
  push:
    branches:
      - main
    paths-ignore:
      - AGENTS.md
      - README.md
      - docs/**
  workflow_dispatch:
    inputs:
      active_profile:
        description: Active profile pack
        required: true
        default: default
      site_url:
        description: Public site URL
        required: true
        default: https://sunionpeaks.pages.dev

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ACTIVE_PROFILE: ${{ inputs.active_profile || 'default' }}
      DEFAULT_LOCALE: zh
      PUBLIC_SITE_URL: ${{ inputs.site_url || 'https://sunionpeaks.pages.dev' }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate CMS config
        run: pnpm dossier generate-admin-config

      - name: Test canonical Notes workflow
        run: pnpm test:notes

      - name: Test modular integrations and assisted sharing
        run: pnpm test:integrations

      - name: Validate active profile
        run: pnpm validate

      - name: Build static site
        run: pnpm build

      - name: Verify built publication identities and feature switches
        run: node scripts/test-publication-build.mjs

      - name: Build isolated Notes MCP artifact
        run: pnpm build:mcp

      - name: Deploy to Cloudflare Pages
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler pages deploy dist --project-name=${{ vars.CLOUDFLARE_PROJECT_NAME }} --branch=${{ github.ref_name }}

      - name: Enforce public site has no Notes write secrets
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PUBLIC_PROJECT_NAME: ${{ vars.CLOUDFLARE_PROJECT_NAME }}
        run: |
          for secret_name in NOTES_MCP_TOKEN NOTES_GITHUB_TOKEN NOTES_GITHUB_REPOSITORY NOTES_GITHUB_BRANCH NOTES_PROFILE_ID PUBLIC_SITE_URL; do
            printf 'y\n' | pnpm exec wrangler pages secret delete "$secret_name" --project-name="$PUBLIC_PROJECT_NAME"
          done

      - name: Provision Notes MCP Managed OAuth
        id: notes_access
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_PAGES_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCESS_API_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NOTES_ACCESS_EMAIL: ${{ secrets.NOTES_ACCESS_EMAIL }}
          NOTES_MCP_PROJECT_NAME: dossierkit-notes-mcp
        run: pnpm provision:notes-access

      - name: Sync OAuth Notes MCP runtime secrets
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NOTES_GITHUB_TOKEN: ${{ secrets.NOTES_GITHUB_TOKEN }}
          NOTES_GITHUB_REPOSITORY: ${{ github.repository }}
          NOTES_GITHUB_BRANCH: main
          NOTES_PROFILE_ID: default
          NOTES_PUBLIC_SITE_URL: ${{ inputs.site_url || 'https://sunionpeaks.pages.dev' }}
          NOTES_ACCESS_AUD: ${{ steps.notes_access.outputs.access_aud }}
          NOTES_ACCESS_ISSUER: ${{ steps.notes_access.outputs.access_issuer }}
          NOTES_ACCESS_EMAIL: ${{ secrets.NOTES_ACCESS_EMAIL }}
          NOTES_MCP_PROJECT_NAME: ${{ steps.notes_access.outputs.project_name }}
        run: |
          printf '%s' "$NOTES_GITHUB_TOKEN" | pnpm exec wrangler pages secret put NOTES_GITHUB_TOKEN --project-name="$NOTES_MCP_PROJECT_NAME"
          printf '%s' "$NOTES_GITHUB_REPOSITORY" | pnpm exec wrangler pages secret put NOTES_GITHUB_REPOSITORY --project-name="$NOTES_MCP_PROJECT_NAME"
          printf '%s' "$NOTES_GITHUB_BRANCH" | pnpm exec wrangler pages secret put NOTES_GITHUB_BRANCH --project-name="$NOTES_MCP_PROJECT_NAME"
          printf '%s' "$NOTES_PROFILE_ID" | pnpm exec wrangler pages secret put NOTES_PROFILE_ID --project-name="$NOTES_MCP_PROJECT_NAME"
          printf '%s' "$NOTES_PUBLIC_SITE_URL" | pnpm exec wrangler pages secret put PUBLIC_SITE_URL --project-name="$NOTES_MCP_PROJECT_NAME"
          printf '%s' "$NOTES_ACCESS_AUD" | pnpm exec wrangler pages secret put NOTES_ACCESS_AUD --project-name="$NOTES_MCP_PROJECT_NAME"
          printf '%s' "$NOTES_ACCESS_ISSUER" | pnpm exec wrangler pages secret put NOTES_ACCESS_ISSUER --project-name="$NOTES_MCP_PROJECT_NAME"
          printf '%s' "$NOTES_ACCESS_EMAIL" | pnpm exec wrangler pages secret put NOTES_ACCESS_EMAIL --project-name="$NOTES_MCP_PROJECT_NAME"

      - name: Deploy OAuth Notes MCP
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler pages deploy dist-mcp --project-name=${{ steps.notes_access.outputs.project_name }} --branch=main

      - name: Record successful production publication
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: notes-publication
          path: dist/_meta/notes.json
          if-no-files-found: error
          retention-days: 90
