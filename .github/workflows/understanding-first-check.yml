name: Understanding-first note and SOP verification
on:
  push:
    branches: [implementation/understanding-first-20261002]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: understanding-first-verification
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ACTIVE_PROFILE: default
      DEFAULT_LOCALE: zh
      PUBLIC_SITE_URL: https://sunionpeaks.pages.dev
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Use isolated input and pin the production base
        run: |
          mkdir -p /tmp/understanding-first-input
          cp ops/understanding-first/* /tmp/understanding-first-input/
          git checkout --detach 83cfb8b4a020ab57f380289ac36d1d18aec2a57b
          python3 - <<'PY'
          from pathlib import Path
          import re
          note=Path('/tmp/understanding-first-input/note.md')
          text=note.read_text()
          diagram='''```mermaid
          sequenceDiagram
            participant C as 客户端
            participant S as 服务端
            C->>S: 发送事件 E1
            Note right of S: 提交并登记 E1
            S--xC: 响应丢失
            C->>S: 沿用 E1 重试
            alt 去重记录仍有效
              S-->>C: 返回原结果 不重复计数
            else 记录缺失或过期
              Note over S: 进入新请求处理路径
            end
          ```'''
          text,n=re.subn(r'```mermaid\n[\s\S]*?```',lambda m:diagram,text)
          assert n==1
          text=text.replace('适合画成一条短流程','适合画成一张时序图')
          note.write_text(text)
          test=Path('/tmp/understanding-first-input/verify-note.mjs')
          js=test.read_text()
          marker="  assert.equal(await page.locator('.mermaid-failed').count(),0);"
          assert js.count(marker)==1
          js=js.replace(marker,marker+'''
            const labels=await page.locator('[data-mermaid-diagram] > svg text').evaluateAll(els=>els.filter(e=>e.textContent.trim()).map(e=>({text:e.textContent,height:e.getBoundingClientRect().height})));
            await writeFile(out+'/diagram-metrics-'+width+'.json',JSON.stringify(labels,null,2));
            await writeFile(out+'/rendered-diagram-'+width+'.svg',await page.locator('[data-mermaid-diagram] > svg').evaluate(e=>e.outerHTML));
            await page.locator('[data-mermaid-diagram]').scrollIntoViewIfNeeded();
            await page.screenshot({path:out+'/legibility-'+width+'.png'});
            assert.ok(labels.length>0,'Rendered diagram labels exist');
            assert.ok(labels.every(l=>l.height >= (width<500?9:12)),'Diagram labels remain legible at actual viewport size');
          ''')
          test.write_text(js)
          PY
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare canonical note and persistent authoring rules
        run: |
          pnpm exec tsx /tmp/understanding-first-input/prepare-candidate.mjs /tmp/understanding-first-input
          pnpm generate:mcp-skill
      - name: Test existing contracts and updated MCP Skill catalog
        run: |
          pnpm test:notes
          pnpm test:assets
          pnpm test:integrations
          pnpm test:views
          pnpm validate
          pnpm build
          pnpm exec tsx scripts/export-publication.ts
          node scripts/test-publication-build.mjs
          node scripts/verify-note-covers.mjs
          pnpm package:plugin
          pnpm build:mcp
      - name: Verify article layout without production traffic
        run: |
          pnpm exec playwright install --with-deps chromium
          node /tmp/understanding-first-input/verify-note.mjs
      - name: Save verified source-only candidate
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const note=JSON.parse(fs.readFileSync('artifacts/understanding-first/note.json'));
          const files=['AGENTS.md','plugins/dossierkit-notes/skills/publish-note/SKILL.md','plugins/dossierkit-notes/skills/publish-note/references/research-quality.md','plugins/dossierkit-notes/skills/publish-note/references/visual-authoring.md','functions/api/mcp.ts','scripts/test-mcp-skill.ts','src/generated/dossierkit-note-skill.ts',note.notePath,note.coverPath];
          execFileSync('git',['add','--',...files],{stdio:'inherit'});
          const staged=execFileSync('git',['diff','--cached','--name-only'],{encoding:'utf8'}).trim().split('\n');
          if(JSON.stringify([...staged].sort())!==JSON.stringify([...files].sort()))throw new Error('Unexpected staged source files');
          execFileSync('git',['config','user.name','github-actions[bot]']);
          execFileSync('git',['config','user.email','41898282+github-actions[bot]@users.noreply.github.com']);
          execFileSync('git',['commit','-m','docs: publish understanding-first note and apply STE-inspired authoring SOP'],{stdio:'inherit'});
          const sha=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          execFileSync('git',['push','origin','HEAD:refs/heads/candidate/understanding-first-20261002-v2'],{stdio:'inherit'});
          const receipt={...note,base:'83cfb8b4a020ab57f380289ac36d1d18aec2a57b',candidate:sha,changedFiles:files,testsPassed:true,deployed:false};
          fs.writeFileSync('artifacts/understanding-first/candidate.json',JSON.stringify(receipt,null,2));
          fs.copyFileSync('/tmp/understanding-first-input/note.md','artifacts/understanding-first/note.md');
          fs.copyFileSync(note.coverPath,'artifacts/understanding-first/cover.svg');
          console.log(JSON.stringify(receipt,null,2));
          JS
      - name: Store private receipts and rendered evidence without fonts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: understanding-first-verification
          path: artifacts/understanding-first/
          if-no-files-found: error
          retention-days: 14
