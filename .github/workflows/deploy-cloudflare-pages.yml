name: Deploy Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      active_profile:
        description: Active profile pack
        required: true
        default: default
      site_url:
        description: Public site URL
        required: true
        default: https://dossierkit.pages.dev

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      ACTIVE_PROFILE: ${{ inputs.active_profile || 'default' }}
      DEFAULT_LOCALE: zh
      PUBLIC_SITE_URL: ${{ inputs.site_url || 'https://dossierkit.pages.dev' }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate CMS config
        run: pnpm dossier generate-admin-config

      - name: Validate active profile
        run: pnpm validate

      - name: Build static site
        run: pnpm build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler pages deploy dist --project-name=${{ vars.CLOUDFLARE_PROJECT_NAME }} --branch=${{ github.ref_name }}
