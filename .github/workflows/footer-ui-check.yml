name: Compact footer verification
on:
  push:
    branches: [implementation/compact-footer-20260921]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      ACTIVE_PROFILE: default
      DEFAULT_LOCALE: zh
      PUBLIC_SITE_URL: https://sunionpeaks.pages.dev
      PUBLIC_VIEWS_ENABLED: 'true'
      GITHUB_REPOSITORY: Nunchakus888/dossierkit
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Prepare UI-only candidate without touching production
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = efd61441c3ec8d69e0707bcd7c0485f7355c0a71
          echo "FOOTER_BASE=$(git rev-parse origin/main)" >> "$GITHUB_ENV"
          python3 scripts/views/footer-ui-update.py
          git rm -f .github/workflows/footer-ui-check.yml scripts/views/footer-ui-update.py
          git add src scripts/views docs
          echo "FOOTER_TREE=$(git write-tree)" >> "$GITHUB_ENV"
          git diff --cached --stat origin/main
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test counts, content, integrations and static build
        run: |
          pnpm dossier generate-admin-config
          pnpm test:views
          pnpm test:notes
          pnpm test:integrations
          pnpm validate
          pnpm build
          pnpm exec tsx scripts/export-publication.ts
          node scripts/test-publication-build.mjs
      - name: Check mobile and desktop without production requests
        run: |
          pnpm exec playwright install --with-deps chromium
          node scripts/views/browser-test.mjs
      - name: Store verified code-only candidate
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          CANDIDATE=$(printf '%s\n' 'style: consolidate page views into a quiet icon-only footer' | git commit-tree "$FOOTER_TREE" -p "$FOOTER_BASE")
          git push origin "$CANDIDATE:refs/heads/candidate/compact-footer-20260921"
          printf '{"commit":"%s","base":"%s","tree":"%s","productionWrites":0}\n' "$CANDIDATE" "$FOOTER_BASE" "$FOOTER_TREE" > artifacts/views/candidate.json
          cat artifacts/views/candidate.json
      - name: Save UI evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: compact-footer-verification
          path: artifacts/views/
          retention-days: 7
          if-no-files-found: warn
