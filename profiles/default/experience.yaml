experiences:
  - company:
      zh: "YC"
      en: "YC"
    role:
      zh: "Agent 平台负责人"
      en: "Agent Platform Lead"
    period:
      zh: "2025-03 - 现在"
      en: "2025-03 - Present"
    location:
      zh: "中国"
      en: "China"
    summary:
      zh: "负责跨行业 WhatsApp AI Agent 客服 SaaS 平台从产品架构演进到生产运营，覆盖 2k+ 租户、23w+ 用户、峰值 6w 请求/天；统筹业务 Agent、RAG/Memory、工具与 Skill、质量运营、成本治理和团队交付。"
      en: "Owned product architecture and production operations for a cross-industry WhatsApp business-Agent SaaS serving 2k+ tenants, 230k+ users, and 60k peak requests/day across RAG/Memory, tools and Skills, quality, cost, and team delivery."
    featuredProjects:
      - title:
          zh: "WhatsApp SaaS 业务 Agent 平台"
          en: "WhatsApp SaaS Business Agent Platform"
        summary:
          zh: "面向客服问答、业务查询、流程办理和人工转接，主导平台从规则编排演进为 LLM 驱动业务 Agent，将意图路由、SOP、知识、工具调用与结果回传沉淀为租户可配置能力；支撑客户问题自动解决率达到 70%+，平均 7k+ tokens 对话负载下端到端约 7s，token 消耗下降 60%。"
          en: "Evolved WhatsApp customer service from rule flows to tenant-configurable LLM business Agents across intent routing, SOPs, knowledge, tools, callbacks, and handoff; delivered 70%+ auto-resolution, about 7s end-to-end latency at 7k+ tokens per conversation, and 60% lower token use."
      - title:
          zh: "企业级 Agentic RAG 与知识自进化"
          en: "Agentic RAG and Knowledge Flywheel"
        summary:
          zh: "建设多租户 Agentic RAG，统一文档、QA、网站、附件、商品等知识接入、切分、embedding、召回与重排；以 unknown questions 聚类和 content gap 回流驱动知识库、RAG 与 Skill 迭代，约 50% 聚类结果进入生产优化，高频主题处理覆盖约 70%，自动解决率提升约 30%。"
          en: "Built multi-tenant Agentic RAG for documents, QA, websites, attachments, and product data, with ingestion, retrieval, reranking, and an unknown-question/content-gap flywheel; 50% of clusters entered production optimization, high-frequency coverage reached 70%, and auto-resolution improved about 30%."
      - title:
          zh: "注意力引导推理 Agent 与复杂任务编排"
          en: "Attentive Reasoning for Complex Workflows"
        summary:
          zh: "基于 LangChain 有向无环图建设注意力引导推理 Agent，以 Guideline、Journey 和 ARQ 将复杂业务任务拆解为意图、规则、工具、参数与合规判断节点，管理分支依赖、终止条件和异常回退，形成可解释、可回放的多步骤执行链。"
          en: "Built a LangChain DAG-based attentive reasoning Agent that decomposed workflows into intent, rule, tool, parameter, and compliance decisions, with explicit dependencies, termination, fallbacks, and replayability."
      - title:
          zh: "用户与会话 Memory 体系"
          en: "User and Session Memory"
        summary:
          zh: "建设会话级与用户级 Memory，统一事实提取、置信筛选、写入更新、召回注入和租户隔离；将历史结论、用户偏好与任务状态按需带入后续交互，减少重复确认并提升长对话和连续任务的一致性。"
          en: "Built tenant-isolated session and user Memory for fact extraction, confidence filtering, write/update, and retrieval injection, carrying prior conclusions, preferences, and task state across interactions."
      - title:
          zh: "企业 AI 协作 CLI 与共享上下文平台"
          en: "AI Collaboration CLI and Shared Context"
        summary:
          zh: "主导内部 AI 协作 CLI 与全员共享上下文机制，覆盖生产发布、运维自动化、case 排查、项目组织和工程自检；整合 Skill、MCP、CLI、仓库规范与 Spec/EPIC，将服务、环境和项目上下文沉淀为团队共享能力，推动 AI 开发 Harness 覆盖 40 个仓库。"
          en: "Led an internal AI collaboration CLI and team-wide shared context for releases, operations automation, case diagnosis, project organization, and checks; integrated Skills, MCP, CLI, repository standards, and Spec/EPIC workflows across 40 repositories."
    highlights: []
    tags:
      - "WhatsApp SaaS"
      - "Business Agent Platform"
      - "Agentic RAG"
      - "Memory"
