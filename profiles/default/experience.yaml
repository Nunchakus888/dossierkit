experiences:
  - company: "YC"
    role:
      zh: "Agent 平台负责人"
      en: "Agent Platform Lead"
    period:
      zh: "2024-03 - 现在"
      en: "2024-03 - Present"
    location:
      zh: "中国"
      en: "China"
    summary:
      zh: "负责跨行业 AI Agent 客服 SaaS 平台和团队工程治理，覆盖 2k+ 租户、23w+ 用户、峰值 6w 请求/天，主导 Agent Runtime、工具/Skill 扩展、RAG/Memory、可观测与成本治理。"
      en: "Led a cross-industry AI Agent customer-service SaaS platform and team engineering governance, covering 2k+ tenants, 230k+ users, and 60k peak requests/day while owning Agent Runtime, tool/Skill extension, RAG/Memory, observability, and cost governance."
    highlights:
      - zh: "主导模型驱动 Agent Runtime 2.0，基于 WorkflowAgent 建设 Agentic RAG、多轮工具调用、终止判断和多 Agent 并行编排，在平均 7k+ tokens 对话负载下将 e2e 主链路控制在约 7s，无工具场景约 1-2k tokens。"
        en: "Led model-driven Agent Runtime 2.0 with WorkflowAgent, covering Agentic RAG, multi-turn tool calls, termination decisions, and parallel multi-agent orchestration; kept the e2e main path around 7s under 7k+ average conversation-token load, with no-tool scenarios around 1-2k tokens."
      - zh: "设计多 Agent 统一上下文维护机制，以稳定 prompt 前缀、动态上下文后置、职责节点隔离和 phase-level usage 审计提升 KV cache 可复用性，并定位耗时与 usage 消耗来源。"
        en: "Designed unified context maintenance for multi-agent execution, using stable prompt prefixes, deferred dynamic context, role-isolated nodes, and phase-level usage auditing to improve KV cache reuse and pinpoint latency and usage drivers."
      - zh: "推进 Agent 服务微服务化解耦，统一 monorepo 工程规范、网关鉴权、内部服务契约、shared 模块和项目化 Docker 构建，缩短运行链路并提升发布与排障效率。"
        en: "Drove microservice-oriented decoupling for the Agent service, standardizing monorepo engineering, gateway authentication, internal service contracts, shared modules, and project-owned Docker builds to shorten runtime paths and improve release/debug efficiency."
      - zh: "建设动态 Skill 与工具按需挂载机制，按当前意图召回 SOP 和专属工具，多 Skill 命中时先澄清并重新路由，兼顾任务效果、上下文长度和工具误调用风险。"
        en: "Built dynamic Skill routing and on-demand tool mounting, retrieving SOPs and dedicated tools by current intent, clarifying ambiguous multi-Skill matches, and balancing task quality, context length, and tool-misuse risk."
      - zh: "建设未知问题聚类与主题发现平台，将每周约 1w+ 至 6w+ 条 unknown questions 沉淀为 content gap，推动约 50% 聚类结果进入知识库/RAG/Skill 迭代，高频主题运营处理覆盖约 70%，自动解决率提升约 30%。"
        en: "Built an unknown-question clustering and topic discovery platform, turning about 10k+ to 60k+ weekly unknown questions into content gaps, with about 50% of clusters feeding knowledge base/RAG/Skill iteration, about 70% coverage on high-frequency topics, and about 30% auto-resolution improvement."
      - zh: "在 20 人产研团队中负责 AI Agent 业务方向，带 3 人小组（2 开发 + 1 测试），并推动 AI 开发 Harness 覆盖 40 个仓库，沉淀架构规则、Spec/EPIC、验收门禁、自检脚本和 PR 模板。"
        en: "Led the AI Agent business track within a 20-person product-engineering team, managed a 3-person squad of 2 developers and 1 QA, and expanded the AI development harness across 40 repositories with architecture rules, Spec/EPIC workflow, acceptance gates, self-check scripts, and PR templates."
    tags:
      - "Agent Runtime"
