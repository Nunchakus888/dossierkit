experiences:
  - company:
      zh: "YC"
      en: "YC"
    role:
      zh: "Agent 平台负责人"
      en: "Agent Platform Lead"
    period:
      zh: "2025-03 - 现在"
      en: "2025-03 - Present"
    location:
      zh: "中国"
      en: "China"
    summary:
      zh: "负责跨行业 WhatsApp AI Agent 客服 SaaS 平台从产品架构演进到生产运营，覆盖 2k+ 租户、23w+ 用户、峰值 6w 请求/天；统筹业务 Agent、RAG/Memory、工具与 Skill、质量运营、成本治理和团队交付。"
      en: "Owned product architecture and production operations for a cross-industry WhatsApp business-Agent SaaS serving 2k+ tenants, 230k+ users, and 60k peak requests/day across RAG/Memory, tools and Skills, quality, cost, and team delivery."
    featuredProjects:
      - title:
          zh: "WhatsApp SaaS 业务 Agent 平台"
          en: "WhatsApp SaaS Business Agent Platform"
        summary:
          zh: "面向客服问答、业务查询、流程办理和人工转接，主导平台从规则编排演进为 LLM 驱动业务 Agent，将意图路由、SOP、知识、工具调用与结果回传沉淀为租户可配置能力；支撑客户问题自动解决率达到 70%+，平均 7k+ tokens 对话负载下端到端约 7s，token 消耗下降 60%。"
          en: "Evolved WhatsApp customer service from rule flows to tenant-configurable LLM business Agents across intent routing, SOPs, knowledge, tools, callbacks, and handoff; delivered 70%+ auto-resolution, about 7s end-to-end latency at 7k+ tokens per conversation, and 60% lower token use."
      - title:
          zh: "企业级 RAG 与 Memory 上下文体系"
          en: "Enterprise RAG and Memory Context Layer"
        summary:
          zh: "建设面向多租户业务 Agent 的统一知识与记忆层，将可靠知识、会话事实、用户偏好和任务状态按需注入模型上下文。"
          en: "Built a unified knowledge and memory layer for multi-tenant business Agents, injecting trusted knowledge, conversation facts, user preferences, and task state on demand."
        details:
          - title:
              zh: "RAG 建设"
              en: "RAG"
            summary:
              zh: "统一文档、QA、网站、附件、商品等知识的接入、切分、embedding、召回与重排；在基础检索之上建设 Agentic RAG，由模型按任务规划检索、改写查询、选择知识源并迭代补充证据，提升复杂问题的信息完整性。"
              en: "Unified ingestion, chunking, embeddings, retrieval, and reranking for documents, QA, websites, attachments, and product data; added model-driven Agentic RAG for retrieval planning, query rewriting, source selection, and iterative evidence gathering."
          - title:
              zh: "Memory 建设"
              en: "Memory"
            summary:
              zh: "建设会话级与用户级 Memory，统一事实提取、置信筛选、写入更新、召回注入和租户隔离，将历史结论、用户偏好与任务状态带入连续交互。"
              en: "Built tenant-isolated session and user Memory with fact extraction, confidence filtering, write/update, and retrieval injection for persistent conclusions, preferences, and task state."
      - title:
          zh: "AI 获客 Agent 平台 0-1 建设"
          en: "0-to-1 AI Lead-generation Agent Platform"
        summary:
          zh: "主导公司首个 AI 获客 Agent 产品从 0 到 1 建设，推动 Dify 工作流方案升级为自主可控的多租户 Agent 平台，将营销咨询、线索识别、信息收集、资格判断、业务查询和人工转接沉淀为可配置能力，形成可规模化销售与复制交付的 AI 获客产品。"
          en: "Led the company's first AI lead-generation Agent product from 0 to 1, replacing a Dify workflow with a controllable multi-tenant platform for marketing, lead capture, qualification, business queries, and handoff, establishing an AI acquisition product for repeatable sales and delivery."
        details:
          - title:
              zh: "可控推理体系"
              en: "Controlled reasoning"
            summary:
              zh: "按 tenant/chatbot/session 动态装配语言、语气、RAG、工具、handover 和业务元数据；以 Guideline 管理规则、Journey 承载多轮 SOP，并用 ARQ（Attentive Reasoning Queries）对意图、工具、参数来源和响应合规形成可审计判断。"
              en: "Assembled language, RAG, tools, handoff, and metadata by tenant, chatbot, and session; combined Guidelines, branching Journeys, and Attentive Reasoning Queries (ARQ) for auditable intent, tool, parameter-provenance, and compliance decisions."
          - title:
              zh: "可靠执行边界"
              en: "Reliable execution"
            summary:
              zh: "建设异步会话全生命周期与 latest-wins 机制，以 correlation_id 串联后台执行和 callback；工具调用前校验适用性、参数来源、必填字段和猜测风险，降低错误调用与业务系统误写。"
              en: "Built an async, latest-wins session lifecycle linked by correlation IDs and callbacks; gated tools by applicability, parameter provenance, required fields, and guessing risk to prevent incorrect calls and business-system writes."
          - title:
              zh: "评测运营闭环"
              en: "Evaluation operations"
            summary:
              zh: "将 evaluation、inspection 和 token usage 纳入生产链路，以 correlation_id、events、ARQ artifacts 和 callback payload 支撑评测与线上问题复盘；报表覆盖 123,071 次 inspection、61,585 个 session 和 1.417B tokens。"
              en: "Embedded evaluation, inspections, and token usage into production, linking issue review through correlation IDs, events, ARQ artifacts, and callbacks across 123,071 inspections, 61,585 sessions, and 1.417B tokens."
      - title:
          zh: "企业 AI 协作 CLI 与共享上下文平台"
          en: "AI Collaboration CLI and Shared Context"
        summary:
          zh: "主导内部 AI 协作 CLI 与全员共享上下文机制，覆盖生产发布、运维自动化、case 排查、项目组织和工程自检；整合 Skill、MCP、CLI、仓库规范与 Spec/EPIC，将服务、环境和项目上下文沉淀为团队共享能力，推动 AI 开发 Harness 覆盖 40 个仓库。"
          en: "Led an internal AI collaboration CLI and team-wide shared context for releases, operations automation, case diagnosis, project organization, and checks; integrated Skills, MCP, CLI, repository standards, and Spec/EPIC workflows across 40 repositories."
      - title:
          zh: "多语言未知问题聚类与知识 Gap 学习平台"
          en: "Multilingual Unknown-question Clustering and Knowledge-gap Learning"
        summary:
          zh: "设计并实现多语言用户问题聚类与主题分析平台，基于 Python、FastAPI、Pydantic 和 MongoDB 构建分层服务，打通数据清洗、语言检测、关键词提取、向量化、降维、聚类、主题归纳与结果持久化；兼容 SentenceTransformer 与 OpenAI 标准 embedding 接口，结合 UMAP、HDBSCAN、BERTopic、c-TF-IDF 与大模型主题生成，并支持 K-Means、层次聚类等可替换算法。通过异步任务、线程池、并发控制和 Webhook 重试保障计算密集型任务稳定运行，引入 Apollo/YAML 动态配置、实验追踪、聚类质量指标、可视化和自动化报告；从早期 HDBSCAN 聚类演进至 LLM 聚类，自主识别知识库 Gap，学习高质量人工会话生成候选知识并提交租户采纳，约 50% 聚类结果进入生产优化，高频主题覆盖约 70%，推动自动解决率提升约 30%。"
          en: "Built a multilingual unknown-question clustering and knowledge-gap learning platform in Python, FastAPI, Pydantic, and MongoDB across cleaning, embeddings, UMAP/HDBSCAN, BERTopic, c-TF-IDF, LLM clustering, topic synthesis, persistence, experiment tracking, and reports. Stabilized compute workloads with async workers, concurrency controls, dynamic configuration, and webhook retries while supporting SentenceTransformer/OpenAI-compatible embeddings and replaceable K-Means or hierarchical algorithms. Evolved HDBSCAN into LLM clustering to detect gaps and learn candidate answers from high-quality human conversations for tenant adoption; about 50% of clusters entered optimization, high-frequency coverage reached 70%, and auto-resolution improved 30%."
    highlights: []
    tags:
      - "WhatsApp SaaS"
      - "Business Agent Platform"
