experiences:
  - company:
      zh: "YC"
      en: "YC"
    role:
      zh: "Agent 平台负责人"
      en: "Agent Platform Lead"
    period:
      zh: "2025-03 - 现在"
      en: "2025-03 - Present"
    location:
      zh: "中国"
      en: "China"
    summary:
      zh: "负责跨行业 WhatsApp AI Agent 客服 SaaS 平台从产品架构演进到生产运营，覆盖 2k+ 租户、23w+ 用户、峰值 6w 请求/天；统筹业务 Agent、RAG/Memory、工具与 Skill、质量运营、成本治理和团队交付。"
      en: "Owned product architecture and production operations for a cross-industry WhatsApp business-Agent SaaS serving 2k+ tenants, 230k+ users, and 60k peak requests/day across RAG/Memory, tools and Skills, quality, cost, and team delivery."
    featuredProjects:
      - title:
          zh: "WhatsApp SaaS 业务 Agent 平台"
          en: "WhatsApp SaaS Business Agent Platform"
        summary:
          zh: "面向客服问答、业务查询、流程办理和人工转接，主导平台从规则编排演进为 LLM 驱动业务 Agent，将意图路由、SOP、知识、工具调用与结果回传沉淀为租户可配置能力；支撑客户问题自动解决率达到 70%+，平均 7k+ tokens 对话负载下端到端约 7s，token 消耗下降 60%。"
          en: "Evolved WhatsApp customer service from rule flows to tenant-configurable LLM business Agents across intent routing, SOPs, knowledge, tools, callbacks, and handoff; delivered 70%+ auto-resolution, about 7s end-to-end latency at 7k+ tokens per conversation, and 60% lower token use."
      - title:
          zh: "企业级 RAG 与 Memory 上下文体系"
          en: "Enterprise RAG and Memory Context Layer"
        summary:
          zh: "建设面向多租户业务 Agent 的统一知识与记忆层，将可靠知识、会话事实、用户偏好和任务状态按需注入模型上下文。"
          en: "Built a unified knowledge and memory layer for multi-tenant business Agents, injecting trusted knowledge, conversation facts, user preferences, and task state on demand."
        details:
          - title:
              zh: "RAG 建设"
              en: "RAG"
            summary:
              zh: "统一文档、QA、网站、附件、商品等知识的接入、切分、embedding、召回与重排；在基础检索之上建设 Agentic RAG，由模型按任务规划检索、改写查询、选择知识源并迭代补充证据，提升复杂问题的信息完整性。"
              en: "Unified ingestion, chunking, embeddings, retrieval, and reranking for documents, QA, websites, attachments, and product data; added model-driven Agentic RAG for retrieval planning, query rewriting, source selection, and iterative evidence gathering."
          - title:
              zh: "Memory 建设"
              en: "Memory"
            summary:
              zh: "建设会话级与用户级 Memory，统一事实提取、置信筛选、写入更新、召回注入和租户隔离，将历史结论、用户偏好与任务状态带入连续交互。"
              en: "Built tenant-isolated session and user Memory with fact extraction, confidence filtering, write/update, and retrieval injection for persistent conclusions, preferences, and task state."
      - title:
          zh: "首个 SaaS AI Agent 产品 0-1 建设"
          en: "0-to-1 Launch of the First SaaS AI Agent Product"
        summary:
          zh: "主导公司首个 AI Agent 产品在 SaaS 业务中从 0 到 1 落地，推动 Dify 工作流升级为自主可控的多租户 Agent 平台，覆盖营销咨询、电商导购、线索识别、信息收集、资格判断、业务查询与人工转接，沉淀面向多行业复制交付的产品能力。"
          en: "Led the company's first AI Agent product from 0 to 1 in its SaaS business, evolving a Dify workflow into a controllable multi-tenant platform for marketing, ecommerce shopping assistance, lead identification, data collection, qualification, business queries, and human handoff, with repeatable delivery across industries."
        details:
          - title:
              zh: "配置驱动与可控推理"
              en: "Configuration and controlled reasoning"
            summary:
              zh: "建设配置驱动的 Agent 工厂，支持租户与 Agent 维度个性化配置 Instructions、Actions、知识库、Skill、MCP、语言风格与人工转接；以 Guideline、Journey 和 ARQ 管理业务规则、多轮流程及关键决策，兼顾灵活交付与行为可控。"
              en: "Built a configuration-driven Agent factory with tenant- and Agent-level customization across Instructions, Actions, knowledge bases, Skills, MCP, language style, and human handoff; used Guidelines, Journeys, and ARQ to govern rules, multi-turn workflows, and critical decisions."
          - title:
              zh: "工程约束与运行保障"
              en: "Engineering controls and runtime assurance"
            summary:
              zh: "以 Agent Harness 统一工程规范、工具边界、异常恢复与发布校验，配套可观测后台呈现会话链路、工具调用、响应质量、耗时与成本，保障复杂任务稳定执行并降低业务系统误调用风险。"
              en: "Used an Agent Harness to standardize engineering rules, tool boundaries, recovery, and release validation, backed by an observability console for conversation flows, tool calls, quality, latency, and cost."
          - title:
              zh: "质量运营闭环"
              en: "Quality operations"
            summary:
              zh: "建立上线前评测、线上回放、问题归因与成本分析闭环，支持按租户、场景和版本对比任务成功率、工具准确性、响应耗时与 token 成本，将过程数据转化为持续优化依据，支撑平台自动解决率提升至 70%+。"
              en: "Established pre-release evaluation, production replay, issue attribution, and cost analysis, comparing task success, tool accuracy, latency, and token cost by tenant, scenario, and version to support continuous optimization and 70%+ auto-resolution."
      - title:
          zh: "AI 开发 Harness 与共享上下文平台"
          en: "AI Development Harness and Shared Context Platform"
        summary:
          zh: "主导企业内部 AI 开发 Harness 与 CLI 平台建设，以统一上下文连接研发、测试、发布与运维流程，覆盖 40 个仓库，减少跨角色信息同步、环境确认和重复排查成本。"
          en: "Led an internal AI development Harness and CLI platform that connected engineering, testing, release, and operations through shared context across 40 repositories, reducing repeated context gathering and diagnosis."
        details:
          - title:
              zh: "研发协作"
              en: "Engineering collaboration"
            summary:
              zh: "通过统一 CLI 封装项目组织、代码上下文加载、工程自检与 case 复现，为不同仓库提供一致的 AI 协作入口。"
              en: "Standardized project organization, code-context loading, engineering checks, and case reproduction through a shared CLI across repositories."
          - title:
              zh: "交付与运维"
              en: "Delivery and operations"
            summary:
              zh: "串联构建发布、环境检查、运维自动化与故障诊断，将高频流程沉淀为可复用命令与 Skill。"
              en: "Connected build and release, environment checks, operations automation, and incident diagnosis through reusable commands and Skills."
          - title:
              zh: "共享上下文"
              en: "Shared context"
            summary:
              zh: "将仓库规范、服务依赖、环境配置和 Spec/EPIC 通过 Skill、MCP 与 CLI 供产研共享，减少重复查找与口头同步，提升需求交付和问题闭环效率。"
              en: "Shared repository rules, service dependencies, environment configuration, and Spec/EPIC context through Skills, MCP, and CLI, improving delivery and issue-resolution flow."
      - title:
          zh: "多语言未知问题聚类与知识 Gap 学习平台"
          en: "Multilingual Unknown-question Clustering and Knowledge-gap Learning"
        summary:
          zh: "建设多语言未知问题聚类与知识 Gap 学习平台，将分散的未解决问题转化为可运营主题和候选知识，形成从问题发现、主题归纳、租户采纳到知识回写的持续学习闭环。"
          en: "Built a multilingual unknown-question clustering and knowledge-gap learning platform that turned unresolved questions into actionable themes and candidate knowledge across discovery, synthesis, tenant adoption, and write-back."
        details:
          - title:
              zh: "算法体系"
              en: "Algorithm pipeline"
            summary:
              zh: "统一多语言清洗、embedding、UMAP/HDBSCAN、BERTopic/c-TF-IDF 与 LLM 聚类，兼容 SentenceTransformer 和 OpenAI 标准接口，支持主题归纳与可替换聚类策略。"
              en: "Unified multilingual cleaning, embeddings, UMAP/HDBSCAN, BERTopic/c-TF-IDF, and LLM clustering with SentenceTransformer and OpenAI-compatible interfaces."
          - title:
              zh: "工程平台"
              en: "Engineering platform"
            summary:
              zh: "基于 Python、FastAPI、Pydantic 和 MongoDB 建设异步任务平台，以并发控制、动态配置、Webhook 重试、实验追踪和质量指标保障计算任务稳定运行。"
              en: "Built an async Python, FastAPI, Pydantic, and MongoDB platform with concurrency controls, dynamic configuration, webhook retries, experiment tracking, and quality metrics."
          - title:
              zh: "知识自进化与成效"
              en: "Knowledge evolution and outcomes"
            summary:
              zh: "从 HDBSCAN 演进至 LLM 聚类，自主识别知识 Gap，并从高质量人工会话学习候选答案供租户采纳；约 50% 聚类结果进入生产优化，高频主题覆盖约 70%，推动自动解决率提升约 30%。"
              en: "Evolved HDBSCAN into LLM clustering to identify knowledge gaps and learn candidate answers from high-quality human conversations; about 50% of clusters entered production optimization, high-frequency coverage reached 70%, and auto-resolution improved 30%."
    highlights: []
    tags:
      - "WhatsApp SaaS"
