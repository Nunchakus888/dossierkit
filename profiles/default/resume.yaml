highlights:
  - zh: "主攻企业级 Agent 平台架构，核心是 runtime、工具体系、权限审计、评测回放和企业系统集成。"
    en: "Focused on enterprise Agent platform architecture across runtime, tool systems, permission audit, replay evaluation, and enterprise integration."
  - zh: "模型数据反馈、LLMOps 与企业集成只作为平台落地证据，服务同一个平台 owner 定位。"
    en: "Model data feedback, LLMOps, and enterprise integration are supporting proof for one platform-owner positioning."
  - zh: "在 YC 担任 Agent 平台负责人期间，同时推动 AI 开发 Harness、团队规范和交付流程落地，把 AI 辅助开发纳入可评审、可验证、可复盘的工程体系。"
    en: "As Agent Platform Lead at YC, also drove AI development harness adoption, team standards, and delivery workflow so AI-assisted engineering became reviewable, verifiable, and traceable."
  - zh: "后续项目实践应补真实平台规模、业务流程、质量门槛、稳定性指标和 ROI 结果。"
    en: "Project evidence should add real platform scale, workflows, quality gates, reliability metrics, and ROI outcomes."
