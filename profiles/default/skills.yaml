skillGroups:
  - id: "agent-platform"
    title:
      zh: "Agent 平台与 Harness"
      en: "Agent Platform and Harness"
    description:
      zh: "覆盖 Agent 循环、上下文、工具执行、评测回放与生产可观测。"
      en: "Agent loops, context, tool execution, replay evaluation, and production observability."
    skills:
      - "Agent Harness / Loop Engineering"
      - "Agentic RAG / Memory"
      - "Multi-agent Orchestration"
      - "Tool-use"
      - "MCP / Skills"
      - "Replay Evaluation"
      - "Trace Observability"
  - id: "retrieval-data-algorithms"
    title:
      zh: "检索与数据算法"
      en: "Retrieval and Data Algorithms"
    description:
      zh: "覆盖检索质量、语义表示、聚类、主题分析和知识反馈闭环。"
      en: "Retrieval quality, semantic representation, clustering, topic analysis, and knowledge feedback loops."
    skills:
      - "Embeddings / Reranking"
      - "UMAP / HDBSCAN"
      - "BERTopic / c-TF-IDF"
      - "K-Means / Hierarchical Clustering"
      - "LLM Clustering / Topic Modeling"
      - "Knowledge-gap Learning"
  - id: "platform-engineering"
    title:
      zh: "平台工程与企业集成"
      en: "Platform Engineering and Enterprise Integration"
    description:
      zh: "覆盖服务端、数据与向量检索、微服务、云基础设施和企业系统接入。"
      en: "Backend, data and vector retrieval, microservices, cloud infrastructure, and enterprise integration."
    skills:
      - "Python / FastAPI"
      - "TypeScript / Node.js"
      - "Rust / Java"
      - "Linux"
      - "PostgreSQL / Redis / Milvus"
      - "Docker / Kubernetes"
      - "Microservices / CI/CD"
      - "Alibaba Cloud / Google Cloud"
  - id: "model-data-engineering"
    title:
      zh: "模型工程与推理服务"
      en: "Model Engineering and Serving"
    description:
      zh: "面向多模型接入、路由、上下文工程、推理服务与生产运营。"
      en: "Multi-model integration, routing, context engineering, inference serving, and production operations."
    skills:
      - "Model APIs / Routing"
      - "Context Engineering"
      - "PyTorch / Stable Diffusion"
      - "Gemini"
      - "LLMOps"
