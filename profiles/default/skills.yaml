skillGroups:
  - id: "agent-platform-architecture"
    title:
      zh: "Agent 平台架构"
      en: "Agent Platform Architecture"
    description:
      zh: "把 Agent 从原型推进到生产所需的运行时、工具、权限、安全和审计能力。"
      en: "Runtime, tools, permissions, security, and audit capabilities needed to move Agents from prototype to production."
    skills:
      - "Agent Runtime"
      - "Workflow Orchestration"
      - "Tool-use / Function Calling"
      - "MCP / Skills / Plugins"
      - "Permission & Audit"
      - "Human-in-the-loop"
  - id: "llm-application-architecture"
    title:
      zh: "大模型应用工程化"
      en: "LLM Application Engineering"
    description:
      zh: "围绕模型选型、上下文工程、RAG、工具边界和成本延迟做系统级设计。"
      en: "System design across model selection, context engineering, RAG, tool boundaries, and cost/latency control."
    skills:
      - "RAG / GraphRAG"
      - "Context Engineering"
      - "Prompt / Tool Boundary"
      - "Model Routing"
      - "Cache / Latency / Cost"
      - "Hallucination Control"
  - id: "evaluation-llmops"
    title:
      zh: "评测与 LLMOps"
      en: "Evaluation and LLMOps"
    description:
      zh: "把主观体验转成可回放、可比较、可发布门禁的工程系统。"
      en: "Turning subjective quality into replayable, comparable, release-gating engineering systems."
    skills:
      - "Replay Evaluation"
      - "Golden Set"
      - "Trace Observability"
      - "Regression Gates"
      - "Online Metrics"
      - "Release Governance"
  - id: "ai-fde-enterprise-integration"
    title:
      zh: "AI FDE 与企业集成"
      en: "AI FDE and Enterprise Integration"
    description:
      zh: "把客户现场流程拆成可交付 AI 产品，接入 ERP、CRM、BI、OA、客服和销售等系统。"
      en: "Turning field workflows into shippable AI products across ERP, CRM, BI, OA, support, and sales systems."
    skills:
      - "Workflow Mapping"
      - "ERP / CRM / BI / OA"
      - "Data Governance"
      - "Identity / Permission Model"
      - "Customer Integration"
      - "Change Management"
  - id: "data-flywheel-posttraining"
    title:
      zh: "数据飞轮与后训练接口"
      en: "Data Flywheel and Post-training Interface"
    description:
      zh: "把线上 badcase、偏好数据、评测集和训练实验连接成持续改进闭环。"
      en: "Connecting production badcases, preference data, evaluation sets, and training experiments into a quality loop."
    skills:
      - "Badcase Taxonomy"
      - "Preference Data"
      - "Labeling Rules"
      - "SFT / DPO Interface"
      - "Evaluation Set Construction"
      - "Feedback Loop"
  - id: "product-technical-leadership"
    title:
      zh: "产品技术负责人能力"
      en: "Product and Technical Leadership"
    description:
      zh: "在产品、算法、工程、安全和业务团队之间建立路线图、架构共识和交付节奏。"
      en: "Aligning product, ML, engineering, security, and business teams around roadmap, architecture, and delivery rhythm."
    skills:
      - "Architecture Review"
      - "Roadmap Ownership"
      - "Cross-functional Alignment"
      - "Platform Adoption"
      - "ROI Modeling"
      - "Team Delivery"
