    title:
      zh: "检索与数据算法"
      en: "Retrieval and Data Algorithms"
    description:
      zh: "覆盖检索质量、语义表示、聚类、主题分析和知识反馈闭环。"
      en: "Retrieval quality, semantic representation, clustering, topic analysis, and knowledge feedback loops."
    skills:
      - "Embeddings"
      - "Reranking"
      - "UMAP"
      - "HDBSCAN"
      - "BERTopic & c-TF-IDF"
      - "LLM Clustering"
      - "Knowledge-gap Learning"
