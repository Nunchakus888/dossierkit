skillGroups:
  - id: "runtime"
    title:
      zh: "Agent Runtime 架构"
      en: "Agent Runtime Architecture"
    description:
      zh: "围绕任务状态、计划执行、工具调用、失败恢复和人工接管建设生产级运行时。"
      en: "Production runtime design across task state, planning, tool calls, failure recovery, and human handoff."
    skills:
      - "Agent Runtime"
      - "Workflow Orchestration"
      - "Tool-use / Function Calling"
      - "MCP / Skills"
      - "Human-in-the-loop"
  - id: "governance"
    title:
      zh: "权限、安全与审计"
      en: "Permission, Security, and Audit"
    description:
      zh: "把工具、数据、身份、租户和敏感操作纳入可控边界，支撑企业级上线。"
      en: "Bringing tools, data, identity, tenancy, and sensitive actions into controlled enterprise boundaries."
    skills:
      - "Permission Model"
      - "Tool Registry"
      - "Audit Trail"
      - "Guardrails"
      - "Data Governance"
  - id: "evaluation"
    title:
      zh: "评测与发布门禁"
      en: "Evaluation and Release Gates"
    description:
      zh: "用回放评测、golden set、过程断言和线上指标替代主观试用。"
      en: "Replacing subjective trials with replay evaluation, golden sets, process assertions, and online metrics."
    skills:
      - "Replay Harness"
      - "Golden Set"
      - "Regression Gates"
      - "Trace Observability"
      - "Release Governance"
  - id: "platform-delivery"
    title:
      zh: "企业系统集成与平台交付"
      en: "Enterprise Integration and Platform Delivery"
    description:
      zh: "把 Agent 接入真实业务流程，沉淀可复用平台能力，并对稳定性和交付结果负责。"
      en: "Integrating Agents into real workflows, building reusable platform capabilities, and owning reliability and delivery outcomes."
    skills:
      - "ERP / CRM / BI / OA"
      - "RAG / Context Engineering"
      - "LLMOps"
      - "Data Flywheel"
      - "Platform Adoption"
  - id: "platform-stack"
    title:
      zh: "平台技术栈"
      en: "Platform Stack"
    description:
      zh: "覆盖 Agent 平台后端、前端、向量检索、云服务和多模型接入。"
      en: "Backend, frontend, vector retrieval, cloud services, and multi-model integration for Agent platforms."
    skills:
      - "Python / FastAPI"
      - "TypeScript"
      - "React / Vue / Node.js"
      - "Rust"
      - "Java"
      - "Milvus"
      - "PostgreSQL / Redis"
      - "PyTorch / Stable Diffusion"
      - "Docker / Kubernetes"
      - "Alibaba Cloud"
      - "Google Cloud"
      - "Gemini"
  - id: "high-traffic-platform"
    title:
      zh: "高流量 Web 与平台工程"
      en: "High-traffic Web and Platform Engineering"
    description:
      zh: "来自阿里业务场景的微前端、跨端、性能、日志和商业化工程基础，用于支撑复杂平台落地。"
      en: "Micro-frontend, cross-platform, performance, logging, and monetization engineering foundation from Alibaba-scale product scenarios."
    skills:
      - "Micro-frontends"
      - "SSR / Edge Rendering"
      - "HTTP2 / Resource Strategy"
      - "Cross-platform H5 / Mini Programs"
      - "JsBridge"
      - "Attribution / Logging SDK"
      - "Component Systems"
      - "CI/CD"
  - id: "ai-engineering-governance"
    title:
      zh: "AI 工程治理与团队规范"
      en: "AI Engineering Governance"
    description:
      zh: "把 AI 辅助开发纳入团队工程流程，通过规则、Spec、EPIC、验收门禁和自检脚本提升评审效率、交付一致性和回滚能力。"
      en: "Bringing AI-assisted development into team engineering workflows through rules, Specs, EPICs, acceptance gates, and self-check scripts to improve review efficiency, delivery consistency, and rollback readiness."
    skills:
      - "AI Development Harness"
      - "Architecture Rules"
      - "Spec / EPIC Workflow"
      - "Supervisor Gate"
      - "Self-check Automation"
      - "Team Standards"
