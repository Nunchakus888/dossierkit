<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1100" viewBox="0 0 720 1100">
<title>图四：从模型候选结果到应用接受结果的五道验收门</title>
<rect x="0" y="0" width="720" height="1100" rx="24" fill="#F7F8FC"/>
<text x="40" y="54" fill="#7658CF" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start">04  /  AGENT OUTPUT CONTRACT</text>
<text x="40" y="109" fill="#202438" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="34" font-weight="700" text-anchor="start">可解析，只通过了其中一道门</text>
<text x="40" y="150" fill="#647087" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">交付的是验收结果，不是第一段合法 JSON。</text>
<rect x="40" y="191" width="640" height="121" rx="18" fill="#FFFFFF" stroke="#DCE1ED" stroke-width="2"/>
<rect x="60" y="215" width="48" height="49" rx="12" fill="#EEEAFC"/>
<text x="84" y="250" fill="#7658CF" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="middle">1</text>
<text x="125" y="243" fill="#202438" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="29" font-weight="700" text-anchor="start">调用状态</text>
<text x="62" y="287" fill="#647087" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">响应正常结束；拒绝、截断单独处理。</text>
<line x1="360" y1="315" x2="360" y2="337" stroke="#647087" stroke-width="3" stroke-linecap="round"/>
<path d="M 354 328 L 360 337 L 366 328" fill="none" stroke="#647087" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="40" y="342" width="640" height="121" rx="18" fill="#FFFFFF" stroke="#DCE1ED" stroke-width="2"/>
<rect x="60" y="366" width="48" height="49" rx="12" fill="#EEEAFC"/>
<text x="84" y="401" fill="#7658CF" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="middle">2</text>
<text x="125" y="394" fill="#202438" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="29" font-weight="700" text-anchor="start">执行闭环</text>
<text x="62" y="438" fill="#647087" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">无待处理工具、审批或未确认副作用。</text>
<line x1="360" y1="466" x2="360" y2="488" stroke="#647087" stroke-width="3" stroke-linecap="round"/>
<path d="M 354 479 L 360 488 L 366 479" fill="none" stroke="#647087" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="40" y="493" width="640" height="121" rx="18" fill="#FFFFFF" stroke="#DCE1ED" stroke-width="2"/>
<rect x="60" y="517" width="48" height="49" rx="12" fill="#EEEAFC"/>
<text x="84" y="552" fill="#7658CF" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="middle">3</text>
<text x="125" y="545" fill="#202438" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="29" font-weight="700" text-anchor="start">结构校验</text>
<text x="62" y="589" fill="#647087" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">完整解析，并符合应用原始 Schema。</text>
<line x1="360" y1="617" x2="360" y2="639" stroke="#647087" stroke-width="3" stroke-linecap="round"/>
<path d="M 354 630 L 360 639 L 366 630" fill="none" stroke="#647087" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="40" y="644" width="640" height="121" rx="18" fill="#FFFFFF" stroke="#DCE1ED" stroke-width="2"/>
<rect x="60" y="668" width="48" height="49" rx="12" fill="#EEEAFC"/>
<text x="84" y="703" fill="#7658CF" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="middle">4</text>
<text x="125" y="696" fill="#202438" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="29" font-weight="700" text-anchor="start">业务与证据</text>
<text x="62" y="740" fill="#647087" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">结论有依据；缺失信息有合法表达。</text>
<line x1="360" y1="768" x2="360" y2="790" stroke="#647087" stroke-width="3" stroke-linecap="round"/>
<path d="M 354 781 L 360 790 L 366 781" fill="none" stroke="#647087" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="40" y="795" width="640" height="121" rx="18" fill="#FFFFFF" stroke="#DCE1ED" stroke-width="2"/>
<rect x="60" y="819" width="48" height="49" rx="12" fill="#EEEAFC"/>
<text x="84" y="854" fill="#7658CF" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="middle">5</text>
<text x="125" y="847" fill="#202438" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="29" font-weight="700" text-anchor="start">提交一致性</text>
<text x="62" y="891" fill="#647087" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">绑定证据版本；结果幂等写入。</text>
<rect x="40" y="959" width="640" height="53" rx="12" fill="#EEEAFC"/>
<text x="360" y="995" fill="#7658CF" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="29" font-weight="700" text-anchor="middle">模型负责提交；运行时负责接受。</text>
<line x1="40" y1="1032" x2="680" y2="1032" stroke="#DCE1ED" stroke-width="3" stroke-linecap="round"/>
<text x="40" y="1070" fill="#647087" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start">架构建议；部分输出可用于预览，不直接触发业务提交。</text>
</svg>
