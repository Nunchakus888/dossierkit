<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><title>本地 Agent 沙箱：保留工作环境，限制执行权限</title><rect width="1200" height="630" fill="#101725"/><text x="65" y="105" fill="#a6b4cf" font-size="22">AGENT SYSTEMS / LOCAL EXECUTION</text><text x="65" y="183" fill="#ffffff" font-size="48" font-weight="700">本地 Agent 沙箱</text><text x="65" y="239" fill="#bfcbe0" font-size="28">保留环境，不继承整台电脑的权限</text><rect x="65" y="293" width="1070" height="232" rx="20" fill="#1c2940"/><rect x="98" y="337" width="300" height="138" rx="14" fill="#314366"/><text x="131" y="395" fill="#ffffff" font-size="28">Local Workspace</text><text x="132" y="435" fill="#bfd0ee" font-size="22">代码 · 依赖 · 测试</text><path d="M430 325V491" stroke="#b14bf4" stroke-width="5"/><text x="479" y="375" fill="#ffffff" font-size="28">Policy Boundary</text><text x="479" y="423" fill="#bfd0ee" font-size="24">文件 / 网络 / 凭据 / 进程</text><text x="479" y="469" fill="#bba2f1" font-size="23">Requested → Effective → Enforced</text><text x="65" y="582" fill="#a6b4cf" font-size="21">本地执行 ≠ 本地推理 ≠ 数据不出设备</text></svg>
