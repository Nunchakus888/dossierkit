<svg xmlns="http://www.w3.org/2000/svg" width="680" height="650" viewBox="0 0 680 650"><title>从 UI 动作到真实执行的安全边界</title><rect width="680" height="650" rx="20" fill="#f7f7fc"/><text x="36" y="51" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="600" fill="#27233f">界面可以生成，执行必须受控</text><rect x="36" y="86" width="608" height="66" rx="12" fill="#e4edfb"/><text x="340" y="126" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="23" fill="#355882">用户提交结构化动作</text><path d="M340 152V180" stroke="#898198" stroke-width="2"/><rect x="36" y="182" width="608" height="79" rx="12" fill="#ffffff" stroke="#d9d6e6"/><text x="59" y="215" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="600" fill="#433768">01  身份、权限与有效期</text><text x="59" y="244" font-family="Noto Sans CJK SC, sans-serif" font-size="18" fill="#6a657b">不通过：拒绝执行并给出可理解的原因</text><path d="M340 261V286" stroke="#898198" stroke-width="2"/><rect x="36" y="288" width="608" height="79" rx="12" fill="#ffffff" stroke="#d9d6e6"/><text x="59" y="321" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="600" fill="#433768">02  内容与任务版本</text><text x="59" y="350" font-family="Noto Sans CJK SC, sans-serif" font-size="18" fill="#6a657b">已变化：刷新内容，要求重新审阅确认</text><path d="M340 367V392" stroke="#898198" stroke-width="2"/><rect x="36" y="394" width="608" height="79" rx="12" fill="#ffffff" stroke="#d9d6e6"/><text x="59" y="427" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="600" fill="#433768">03  幂等与冲突检查</text><text x="59" y="456" font-family="Noto Sans CJK SC, sans-serif" font-size="18" fill="#6a657b">已处理：返回既有结果；参数不同则报告冲突</text><path d="M340 473V498" stroke="#898198" stroke-width="2"/><rect x="36" y="500" width="608" height="78" rx="12" fill="#eae6f8"/><text x="340" y="534" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="600" fill="#433768">执行授权操作，记录真实回执</text><text x="340" y="562" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="18" fill="#635d76">跨服务效果还需下游幂等或补偿机制</text><text x="340" y="618" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="18" fill="#6a657b">通过 UI Schema ≠ 获得业务授权 ≠ 已执行成功</text></svg>
