<svg xmlns="http://www.w3.org/2000/svg" width="680" height="920" viewBox="0 0 680 920"><title>跨 Agent 与跨平台的分层交互架构</title><rect width="680" height="920" rx="20" fill="#f7f7fc"/><text x="36" y="51" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="600" fill="#27233f">多对多连接，分层解耦</text><text x="36" y="83" font-family="Noto Sans CJK SC, sans-serif" font-size="18" fill="#686478">建议架构 · 各层可以先作为同一应用内模块</text><rect x="36" y="113" width="608" height="94" rx="14" fill="#eae6f8"/><text x="340" y="151" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="600" fill="#433768">业务任务 · 产物 · 动作 · 权限</text><text x="340" y="182" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="18" fill="#635d76">服务端权威状态与版本，不依附具体界面</text><rect x="36" y="237" width="608" height="78" rx="14" fill="#ffffff" stroke="#d9d6e6"/><text x="340" y="271" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="23" fill="#302b46">不同 Agent Runtime</text><text x="340" y="299" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="17" fill="#6a657b">框架专有执行能力通过适配器映射</text><path d="M340 315V345M334 339L340 346L346 339" fill="none" stroke="#837496" stroke-width="2"/><rect x="36" y="348" width="608" height="90" rx="14" fill="#e9e0fb"/><text x="340" y="385" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="600" fill="#543a87">AG-UI 运行交互</text><text x="340" y="416" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="18" fill="#6a5887">消息 · 工具过程 · 共享投影 · 中断与恢复</text><path d="M340 438V468M334 462L340 469L346 462" fill="none" stroke="#837496" stroke-width="2"/><rect x="36" y="471" width="608" height="90" rx="14" fill="#ffffff" stroke="#d9d6e6"/><text x="340" y="508" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24" fill="#302b46">呈现与能力选择</text><text x="340" y="539" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="18" fill="#6a657b">按端能力选择模板；权限在业务层核验</text><path d="M340 561V583H185V604M340 583H495V604" fill="none" stroke="#837496" stroke-width="2"/><rect x="36" y="607" width="294" height="113" rx="14" fill="#e4edfb"/><rect x="350" y="607" width="294" height="113" rx="14" fill="#eef0f5"/><text x="183" y="646" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="600" fill="#355882">A2UI Renderer</text><text x="183" y="678" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="19" fill="#536984">Web／移动端</text><text x="183" y="704" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="16" fill="#65758e">匹配目录与本地组件</text><text x="497" y="646" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="600" fill="#414b61">平台适配器</text><text x="497" y="678" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="19" fill="#626b7d">群聊／终端／语音</text><text x="497" y="704" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="16" fill="#697487">保持语义，允许不同呈现</text><path d="M183 720V746H497V720M340 746V773" fill="none" stroke="#837496" stroke-width="2"/><rect x="36" y="776" width="608" height="74" rx="14" fill="#30283f"/><text x="340" y="820" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="23" fill="#ffffff">自然语言与直接操作，共享同一任务</text><text x="340" y="889" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="18" fill="#6a657b">动作回传业务边界；历史恢复不重新执行副作用</text></svg>
