<circle cx="1000" cy="140" r="240" fill="#102b39"/>
<g>
<text x="78" y="105" font-size="22" fill="#72ddbd" letter-spacing="3">macOS · PMSET</text>
<text x="78" y="202" font-size="59" font-weight="700" fill="#f4f8fc">合盖，任务继续</text>
<text x="81" y="255" font-size="27" fill="#a9bdcf">电池供电下的命令行实测</text>
<rect x="80" y="312" width="467" height="68" rx="15" fill="#142b3b" stroke="#355165"/>
<text x="107" y="356" font-size="28" fill="#8ce6c7">pmset -a disablesleep 1</text>
