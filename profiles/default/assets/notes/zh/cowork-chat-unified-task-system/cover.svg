<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><title>Cowork 与 Chat 合并：统一入口背后的任务系统</title><rect width="1200" height="630" fill="#191720"/><rect x="65" y="57" width="92" height="6" rx="3" fill="#fa5560"/><text x="65" y="118" fill="#c7b6c8" font-size="22">AGENT SYSTEMS / UNIFIED WORKSPACE</text><text x="65" y="196" fill="#ffffff" font-size="51" font-weight="700">Cowork + Chat</text><text x="65" y="254" fill="#e1d6e3" font-size="30">入口合并，任务与权限仍需分层</text><rect x="65" y="321" width="290" height="151" rx="18" fill="#353040"/><text x="99" y="381" fill="#ffffff" font-size="29">One Conversation</text><text x="99" y="429" fill="#bdb0c6" font-size="23">讨论 · 指令 · 审阅</text><path d="M376 395H468" stroke="#b14bf4" stroke-width="5"/><rect x="491" y="321" width="643" height="151" rx="18" fill="#302d43"/><text x="530" y="379" fill="#ffffff" font-size="29">Task → Run → Artifact</text><text x="530" y="428" fill="#c9beda" font-size="24">Cloud Execution + Scoped Desktop Access</text><text x="65" y="572" fill="#bcb1c5" font-size="22">更简单的交互，需要更明确的状态与执行边界</text></svg>