<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><title>Copilot 默认功能策略：未配置、继承与生效机制</title><rect width="1200" height="630" fill="#171525"/><rect x="64" y="61" width="92" height="6" rx="3" fill="#b14bf4"/><text x="64" y="121" fill="#bcb4d5" font-size="22">AGENT SYSTEMS / CONFIGURATION CONTROL</text><text x="64" y="198" fill="#ffffff" font-size="48" font-weight="700">一个开关，四种状态</text><text x="64" y="254" fill="#d1c9e1" font-size="29">默认功能策略的继承与解释</text><rect x="64" y="326" width="248" height="104" rx="16" fill="#323049"/><rect x="337" y="326" width="248" height="104" rx="16" fill="#323049"/><rect x="610" y="326" width="248" height="104" rx="16" fill="#323049"/><rect x="883" y="326" width="253" height="104" rx="16" fill="#47335a"/><text x="107" y="388" fill="#ffffff" font-size="27">Enabled</text><text x="376" y="388" fill="#ffffff" font-size="27">Disabled</text><text x="650" y="388" fill="#ffffff" font-size="27">Delegate</text><text x="905" y="387" fill="#ffffff" font-size="25">Unconfigured</text><path d="M189 451H1009" stroke="#9865d6" stroke-width="4"/><text x="65" y="512" fill="#c7bedb" font-size="23">Scope → Eligibility → Explicit Choice → Default → Explanation</text><text x="65" y="580" fill="#a99eba" font-size="21">Feature Availability ≠ Action Authorization</text></svg>