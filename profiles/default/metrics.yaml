metrics:
  - label:
      zh: "主定位"
      en: "Positioning"
    value:
      zh: "Agent 平台 / AI FDE / LLM 架构"
      en: "Agent Platform / AI FDE / LLM Architecture"
    description:
      zh: "不是单点 Agent 应用开发，而是面向企业核心流程的平台化、集成化和交付负责人能力。"
      en: "Not single-purpose Agent app development, but platform, integration, and delivery ownership for enterprise workflows."
  - label:
      zh: "证据主线"
      en: "Proof line"
    value:
      zh: "平台级作品 / ROI / 模型侧理解"
      en: "Platform work / ROI / Model-side judgment"
    description:
      zh: "后续项目实践重点补真实架构图、效率指标、成本延迟、成功率和评测闭环。"
      en: "Project evidence should add real architecture, efficiency, cost/latency, success-rate, and evaluation-loop proof."
  - label:
      zh: "交付闭环"
      en: "Delivery loop"
    value:
      zh: "业务流程 → Runtime → 评测 → 数据反馈"
      en: "Workflow → Runtime → Evaluation → Data feedback"
    description:
      zh: "把产品、算法、工程、安全和业务方拉到同一套上线标准与复盘机制。"
      en: "Aligns product, ML, engineering, security, and business teams on release gates and review loops."
