pdfFilenameBase: "George-AI Agent开发专家"
focus:
  zh: "企业级 Agent 产品化、跨应用人机协作与 AI 研发提效"
  en: "Enterprise Agent Products, Human–AI Collaboration, and AI-assisted Development"
summary:
  zh: "10 年大型平台与 AI 产品研发经验，历经阿里、商汤。主导企业级 Agent 从 0 到 1 建设与规模化落地，支撑 2k+ 租户，客户问题自动解决率达 70%+；带领团队将 AI 融入研发交付，并主导 Cowork 云端 Agent 工作系统的架构与核心实现。"
  en: "10 years building large-scale platforms and AI products, with experience at Alibaba and SenseTime. Led enterprise Agent development from inception to serving 2k+ tenants with 70%+ customer-issue auto-resolution. Leads AI-assisted engineering delivery and the architecture and core implementation of Cowork, a cloud Agent work system."
experiences:
  - sourceCompany: "YC"
    summary:
      zh: "负责跨行业 WhatsApp AI Agent SaaS 的产品架构与持续迭代，带领 4 人 Agent 小组，协同 20 人产研团队，对业务效果、运行成本与交付负责。"
      en: "Leads architecture and delivery for a cross-industry WhatsApp AI Agent SaaS, heading a 4-person Agent squad within a 20-person product-engineering team and owning business outcomes, operating costs, and delivery."
    projects:
      - title:
          zh: "跨行业业务 Agent 产品化"
          en: "Configurable business agents across industries"
        summary:
          zh: "主导业务从规则编排演进为 LLM 驱动，将意图路由、SOP、知识、工具和人工转接沉淀为租户可配置能力，客户问题自动解决率达到 70%+。"
          en: "Led the transition from rule flows to LLM-driven execution, making routing, SOPs, knowledge, tools, and handoff tenant-configurable; reached 70%+ customer-issue auto-resolution."
      - title:
          zh: "Cowork：持续任务与成果交付"
          en: "Cowork: persistent tasks and deliverable work"
        summary:
          zh: "将跨系统处理与人工交接设计为持续任务：用户可跟进进度、批准关键操作并取得成果；Web/嵌入工作台与外部 API 共用任务服务。"
          en: "Designed Cowork around persistent cross-system tasks: users track progress, approve critical actions, and receive artifacts through a shared Web, embedded, and API task service."
      - title:
          zh: "复杂对话的响应与成本优化"
          en: "Faster, lower-cost handling of complex conversations"
        summary:
          zh: "建设 Agentic RAG、会话与用户 Memory、多 Agent 协作及 Skill/MCP 工具体系，统一上下文与执行边界；平均 7k+ tokens 对话负载下端到端约 7s，token 消耗下降 60%。"
          en: "Built Agentic RAG, session/user Memory, multi-agent collaboration, and Skill/MCP tools with shared context and execution controls; achieved about 7s end-to-end latency at 7k+ tokens per conversation and 60% lower token use."
      - title:
          zh: "把未解决问题转化为知识改进"
          en: "Turning unresolved questions into knowledge improvements"
        summary:
          zh: "贯通上线前评测、线上回放、问题归因和成本分析；将多语言未知问题聚类与人工会话学习接入知识回写，约 50% 聚类结果进入生产优化，高频主题覆盖约 70%。"
          en: "Connected pre-release evaluation, production replay, issue attribution, and cost analysis with multilingual clustering and knowledge write-back; about 50% of clusters entered production optimization, with 70% high-frequency topic coverage."
      - title:
          zh: "AI 驱动的研发提效"
          en: "AI-assisted engineering delivery"
        summary:
          zh: "以共享上下文、CLI、Skill 和 MCP 贯通开发、测试、发布、部署与验证，覆盖 40 个仓库；减少跨角色等待与重复排查，标准化交付效率达到原协作方式约 10 倍。"
          en: "Connected development, testing, release, deployment, and verification through shared context, CLI, Skills, and MCP across 40 repositories; standardized delivery reached roughly 10x the prior collaboration model's efficiency."
  - sourceCompany: "Independent Venture"
    summary:
      zh: "负责 AI 数据与模型服务产品的定义、架构、全栈实现及企业交付；建设多模态标注、模型产物、自动标注与质量校验闭环，封装可插拔 Serverless 推理服务。"
      en: "Owned product definition, architecture, full-stack implementation, and enterprise delivery for AI data/model services, connecting multimodal annotation, model artifacts, auto-labeling, and validation with pluggable serverless inference."
  - sourceCompany: "SenseTime"
    summary:
      zh: "参与秒画 AIGC SaaS 从 0 到 1 建设，负责模型接入与服务化架构，覆盖 LoRA 训练对接、异步队列、模型存储、后处理、RPC、负载均衡和生产监控。"
      en: "Contributed to miaohua AIGC SaaS from 0 to 1, owning model integration and service architecture across LoRA training integration, async queues, model storage, post-processing, RPC, load balancing, and production monitoring."
  - sourceCompany: "Alibaba Group"
    summary:
      zh: "负责本地生活商业推广与淘宝新零售的高流量跨端工程；主导淘宝直播互动层向 H5 微前端编排演进，以 SSR 与分级资源策略将 FCP 稳定在 1.5s 以内。"
      en: "Built high-traffic, cross-platform systems for Local Services and Taobao new retail; led Taobao Live's transition to H5 micro-frontends, using SSR and tiered resources to keep FCP below 1.5s."
  - sourceCompany: "Ningbo Senpu Rongxun"
    summary:
      zh: "建设 Spring Boot/MyBatis 金融报表服务，完成 AngularJS 到 Vue 的迁移与共享组件建设。"
      en: "Built Spring Boot/MyBatis reporting services and migrated AngularJS to Vue with shared UI components."
architecture:
  title:
    zh: "Cowork · 云端 Agent 工作系统"
    en: "Cowork · Cloud Agent Work System"
  stage:
    zh: "产品架构与核心实现"
    en: "Product Architecture & Core Implementation"
  summary:
    zh: "主导基于 Kubernetes 的 Cowork 架构与核心实现，以 Session/Run 串联 Agent Runtime、MCP/Skill、按需 Computer、事件、审批与成果交付。"
    en: "Led the Kubernetes-based Cowork architecture and core implementation, connecting the Agent Runtime, MCP tools and Skills, on-demand Computer, events, approvals, and artifacts through Session/Run."
  points:
    - title:
        zh: "长任务可靠执行"
        en: "Reliable long-running tasks"
      status: implemented
      summary:
        zh: "实现 Session/Run/Attempt/Operation 状态机、Actor 幂等、SSE 重放与 Pi 检查点；重启后对账，结果不明的外部操作不盲目重试。"
        en: "Built a Session/Run/Attempt/Operation state machine with actor-scoped idempotency, replayable SSE events, and Pi checkpoints; reconciled restarts without blindly retrying uncertain external operations."
    - title:
        zh: "按需隔离执行与人机授权"
        en: "On-demand isolation and human authorization"
      status: implemented
      summary:
        zh: "仅在需要网页或文件操作时创建 Sandbox，实现容量控制、Workspace 快照和成果校验下载；审批绑定具体工具请求，Web/Actor 与租户资源分别鉴权。"
        en: "Provisioned Sandbox only for browser or file work, with capacity control, workspace snapshots, and verified artifact downloads; bound approval to exact tool requests and enforced Web, actor, and tenant boundaries."
    - title:
        zh: "自配置与连接治理"
        en: "Self-configuration and connection governance"
      status: implemented
      summary:
        zh: "实现分层配置、任务级能力快照和按需验真 Skill；对接 CP/OC 的连接与授权，分离任务身份、业务权限和 Provider 凭证。"
        en: "Implemented layered configuration, per-run capability snapshots, and verified on-demand Skills; integrated CP/OC connections and grants while separating task identity, business permissions, and Provider credentials."
    - title:
        zh: "多入口与团队协作"
        en: "Multi-entry and team collaboration"
      status: designed
      summary:
        zh: "规划 CLI、消息渠道及其他 Agent 共用 Session/Run 的接入契约和对外 Cowork MCP 服务；设计群聊 @Agent 的逐角色授权、跨职责任务推进与结果回送。"
        en: "Designed a shared Session/Run integration contract and inbound Cowork MCP service for CLI, channels, and other Agents, plus role-scoped authorization and result delivery for group-chat @Agent tasks."
research:
  - title:
      zh: "长任务的可靠执行与故障恢复"
      en: "Reliable execution and recovery for long-running tasks"
    summary:
      zh: "围绕工具等待、任务中断和重复执行，研究任务状态、检查点、幂等重试与资源调度，分析可靠完成任务与提高推理吞吐之间的取舍。"
      en: "Studied task state, checkpoints, idempotent retries, and resource scheduling under tool waits, interruptions, and repeated execution, examining trade-offs between task reliability and inference throughput."
    sources:
      - noteRef: "zh/agent-runtime-execution-system-task-state-orchestration"
        label: { zh: "执行系统", en: "Execution systems" }
  - title:
      zh: "高风险操作的授权与追溯"
      en: "Authorization and traceability for high-risk actions"
    summary:
      zh: "基于 CAVA 研究 Shell、MCP、浏览器操作的统一动作身份，分析如何让审批绑定实际执行内容，并通过回执追溯副作用与授权边界。"
      en: "Analyzed CAVA's shared action identity across Shell, MCP, and browser operations, including how approvals bind to actual execution and receipts trace side effects and authorization boundaries."
    sources:
      - noteRef: "zh/cava-canonical-action-runtime-governance"
        label: { zh: "动作身份", en: "Action identity" }
  - title:
      zh: "跨端交互与人工接管"
      en: "Cross-device interaction and human takeover"
    summary:
      zh: "比较 AG-UI、A2UI、MCP Apps 的交互边界；以 Task、Artifact、Action、Permission 为稳定语义，设计对话、界面操作、Agent 执行与人工审批在同一任务中接续。"
      en: "Compared AG-UI, A2UI, and MCP Apps; used stable Task, Artifact, Action, and Permission semantics to design continuity across conversation, direct UI actions, Agent execution, and human approval."
    sources:
      - noteRef: "zh/ag-ui-a2ui-agent-runtime-generative-ui-ai-native"
        label: { zh: "交互架构", en: "Interaction architecture" }
      - noteRef: "zh/chatgpt-dots-agent-harness-agent-codex-agent"
        label: { zh: "接管实践", en: "Takeover reference" }
