      zh: "参与秒画 AIGC SaaS 从 0 到 1 建设，负责模型接入与服务化架构，覆盖 LoRA 训练对接、异步队列、模型存储、后处理、RPC、负载均衡和生产监控。"
      en: "Contributed to miaohua AIGC SaaS from 0 to 1, owning model integration and service architecture across LoRA training integration, async queues, model storage, post-processing, RPC, load balancing, and production monitoring."
  - sourceCompany: "Alibaba Group"
    summary:
      zh: "负责本地生活商业推广与淘宝新零售的高流量跨端工程；主导淘宝直播互动层向 H5 微前端编排演进，以 SSR 与分级资源策略将 FCP 稳定在 1.5s 以内。"
      en: "Built high-traffic, cross-platform systems for Local Services and Taobao new retail; led Taobao Live's transition to H5 micro-frontends, using SSR and tiered resources to keep FCP below 1.5s."
  - sourceCompany: "Ningbo Senpu Rongxun"
    summary:
      zh: "建设 Spring Boot/MyBatis 金融报表服务，完成 AngularJS 到 Vue 的迁移与共享组件建设。"
      en: "Built Spring Boot/MyBatis reporting services and migrated AngularJS to Vue with shared UI components."
architecture:
  title:
    zh: "Cowork · 跨入口协作与持续任务执行"
    en: "Cowork · Cross-channel Collaboration & Persistent Execution"
  stage:
    zh: "架构设计与工程研究"
    en: "Architecture Design & Engineering Research"
  summary:
    zh: "面向个人与小团队，设计在不同应用、设备和群聊中持续推进同一项工作的 Agent 系统，让身份、任务状态、权限与交付记录围绕同一工作空间组织。"
    en: "Designed an Agent system for individuals and small teams to continue the same work across applications, devices, and group chats, organizing identity, task state, permissions, and delivery records around a shared workspace."
  points:
    - title:
        zh: "任务连续性"
        en: "Task continuity"
      summary:
        zh: "设计入口与核心任务状态分离的模型，区分会话、执行记录和交付物，使跨入口接续不依赖单次聊天或临时计算机环境。"
        en: "Designed the separation of entry points from core task state, distinguishing conversations, executions, and artifacts so continuation is not tied to one chat or temporary computer."
    - title:
        zh: "协作与授权"
        en: "Collaboration and authorization"
      summary:
        zh: "围绕多人参与同一任务，设计参与者身份、资源授权与操作审批的边界，将共享工作上下文与共享执行权限分别处理。"
        en: "Defined participant identity, resource authorization, and action-approval boundaries for shared tasks, treating shared work context and execution permissions separately."
    - title:
        zh: "执行环境与接管"
        en: "Execution environments and takeover"
      summary:
        zh: "设计 Browser、Computer 与工具执行资源的适配边界，研究按需分配、产物保留及人工接手同一远程工作现场的控制权切换。"
        en: "Designed adapter boundaries for browser, computer, and tool execution resources; studied on-demand allocation, artifact retention, and control transfer within the same remote workspace."
research:
  - title:
      zh: "长期任务与执行系统"
      en: "Long-running tasks and execution systems"
    summary:
      zh: "研究任务状态、事件日志与检查点、幂等重试和 CPU/GPU 资源调度的分工，区分任务正确性与推理吞吐优化。"
      en: "Examined task state, event logs, checkpoints, idempotent retries, and CPU/GPU scheduling, separating workflow correctness from inference-throughput optimization."
    sources:
      - noteRef: "zh/agent-runtime-execution-system-task-state-orchestration"
        label: { zh: "执行系统", en: "Execution systems" }
  - title:
      zh: "动作语义与运行治理"
      en: "Action semantics and runtime governance"
    summary:
      zh: "分析 CAVA 对 Shell、MCP、Browser 等执行事件的语义归一化，研究动作身份与策略、审批、回执的绑定及覆盖边界。"
      en: "Analyzed CAVA's semantic normalization of Shell, MCP, and Browser events, including the binding of action identity to policy, approval, and receipts, and limits of enforcement coverage."
    sources:
      - noteRef: "zh/cava-canonical-action-runtime-governance"
        label: { zh: "动作身份", en: "Action identity" }
  - title:
      zh: "AI 原生交互与人机接管"
      en: "AI-native interaction and human takeover"
    summary:
      zh: "比较 AG-UI、A2UI、MCP Apps 等交互边界，研究状态同步、用户介入与共享远程桌面，形成跨端任务协作的参考方案。"
      en: "Compared AG-UI, A2UI, and MCP Apps boundaries; studied state synchronization, user intervention, and shared remote desktops as reference designs for cross-device task collaboration."
    sources:
      - noteRef: "zh/ag-ui-a2ui-agent-runtime-generative-ui-ai-native"
        label: { zh: "交互架构", en: "Interaction architecture" }
      - noteRef: "zh/chatgpt-dots-agent-harness-agent-codex-agent"
        label: { zh: "接管实践", en: "Takeover reference" }
