              - label: ZH
                name: zh
                widget: text
              - label: EN
                name: en
                widget: text
          - label: Years of Experience
            name: yearsOfExperience
            widget: number
          - label: Location
            name: location
            widget: object
            required: true
            fields:
              - label: ZH
                name: zh
                widget: string
              - label: EN
                name: en
                widget: string
