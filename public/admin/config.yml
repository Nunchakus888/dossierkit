backend:
  name: github
  repo: Nunchakus888/dossierkit
  branch: main
  base_url: https://dossierkit.pages.dev
  auth_endpoint: api/auth
local_backend: true
media_folder: profiles/default/assets
public_folder: /profile-assets/default
publish_mode: editorial_workflow
collections:
